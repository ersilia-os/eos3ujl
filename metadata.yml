Status: Ready
Title: Mtb cell wall permeability
Description: Predicts passage across the Mycobacterium tuberculosis cell wall, an
  unusually thick mycolic acid barrier that blocks many otherwise active compounds
  and helps explain why tuberculosis chemotherapy remains so protracted. Banerjee
  and colleagues compiled permeability measurements and compared several machine learning
  approaches, selecting the best-performing combination of descriptors and algorithm.
  Permeability is necessary but not sufficient for antitubercular activity, so a high
  score indicates access rather than efficacy.
