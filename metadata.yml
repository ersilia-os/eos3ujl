Title: Mtb cell wall permeability
Description: Predicts passage across the Mycobacterium tuberculosis cell wall, a thick
  mycolic acid barrier that blocks many otherwise active compounds and helps explain
  why tuberculosis chemotherapy is so protracted. Banerjee and colleagues labelled
  5,368 compounds permeable or impermeable from published antimycobacterial assay
  data in PubChem, compared four algorithms over RDKit and Mordred descriptors, and
  found a support vector classifier best, near 80% accuracy on held-out data. Permeability
  is necessary but not sufficient for activity, so a high score means access rather
  than efficacy.
